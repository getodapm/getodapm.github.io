<title>ODAPM — Open Data AI Pricing Model</title>
<meta name="description" content="An open standard for describing and pricing restoration work — derived from public market data, buildable by anyone with an AI assistant, owned by no one.">
<link rel="canonical" href="https://odapm.ai/">
<meta http-equiv="refresh" content="0; url=https://odapm.ai/">
<!--
  This file is NOT the site. It is a pointer to it.

  Two things publish out of this repository and they are not the same thing:

    site/       -> odapm.ai, served by the odapm-site Worker (see wrangler.toml)
    this file   -> getodapm.github.io, served by GitHub Pages from main's root

  GitHub Pages can only publish the repository root or /docs, so it cannot be
  aimed at site/. Until now the two were byte-identical copies of one page,
  which is a standing invitation for the published site and the Pages copy to
  drift apart and start disagreeing about what ODAPM says. A pointer cannot
  drift.

  EDIT site/index.html. Nothing here needs to change when the page does.
-->
<style>
body{font-family:Georgia,'Times New Roman',serif;background:#fafbfc;color:#222;
     display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:24px;text-align:center}
a{color:#2e74b5}
</style>
</head>
<body>
<!-- Visible only if the redirect does not fire: no JavaScript, no meta refresh. -->
<p>ODAPM lives at <a href="https://odapm.ai/">odapm.ai</a>.</p>
<script>location.replace('https://odapm.ai/')</script>
</body>

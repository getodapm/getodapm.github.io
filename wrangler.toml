name = "odapm-site"
compatibility_date = "2026-08-26"

# Wrangler sends anonymous usage telemetry by default. Off here rather than by
# `wrangler telemetry disable`, which writes to a global config file outside
# this repository -- a setting that only exists on one laptop is a coincidence,
# not a setting. Matches odapm-tool.
send_metrics = false

# Custom domains. Wrangler creates the DNS records in the zone on deploy,
# so odapm.ai goes live with the first successful deploy rather than
# sitting on a workers.dev subdomain.
# odapm.ai stays a custom domain: the apex cannot collide with *.odapm.ai,
# because that wildcard requires at least one label.
#
# www is a ROUTE, not a custom domain, and that distinction is load-bearing.
# The odapm-tool Worker holds *.odapm.ai/* to serve tenant subdomains, and a
# wildcard route was observed to BEAT a custom domain -- www.odapm.ai served
# the tool's login page until this changed. Route-vs-route is resolved by
# specificity, so www.odapm.ai/* wins. Any future subdomain on this zone that
# must not be the tool needs an explicit route here for the same reason.
routes = [
  { pattern = "odapm.ai", custom_domain = true },
  { pattern = "www.odapm.ai/*", zone_name = "odapm.ai" },
]

# Assets-only Worker: no `main`, and therefore no `binding` key
# (a binding is only valid alongside a Worker script).
#
# `site/` is an explicit allowlist, not the repo root with exclusions.
# Wrangler's --dry-run does not apply .assetsignore, so a denylist here
# could not be verified before deploying — and publishing .git to a
# public origin is not a mistake worth risking to save one directory.
[assets]
directory = "./site"
not_found_handling = "404-page"

# odapm.org is a different Worker, not a suffix of odapm-site.
# Named-env `routes` inherit the top-level list if omitted — that would bind
# this Worker to odapm.ai. Set routes here so org never attaches .ai.
# www can be a custom domain: there is no *.odapm.org tool wildcard.
# workers_dev is off: this account has no workers.dev subdomain registered,
# and wrangler will refuse to deploy if it is on.
[env.org]
name = "odapm-org"
workers_dev = false
routes = [
  { pattern = "odapm.org", custom_domain = true },
  { pattern = "www.odapm.org", custom_domain = true },
]

[env.org.assets]
directory = "./site-org"
not_found_handling = "404-page"
